name: Android

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Unit tests and Android lint
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:dependencyInventory --stacktrace
          python3 tools/validation_summary.py
      - name: Runtime dependency advisories
        run: python3 tools/audit_dependencies.py app/build/reports/dependencies.tsv app/build/reports/dependency-audit.json
      - name: Assemble debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KalPlan-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KalPlan-validation
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: ["26", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Resolve available emulator image
        id: image
        env:
          REQUESTED_API: ${{ matrix.api }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list > "$RUNNER_TEMP/sdk-packages.txt"
          python3 tools/resolve_emulator.py "$RUNNER_TEMP/sdk-packages.txt" "$REQUESTED_API" "$GITHUB_OUTPUT"
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ steps.image.outputs.api }}
          arch: x86_64
          target: ${{ steps.image.outputs.target }}
          disable-animations: true
          script: bash tools/run_device_tests.sh
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: KalPlan-device-${{ steps.image.outputs.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/screenshots/
            app/build/device-validation/
          retention-days: 14

